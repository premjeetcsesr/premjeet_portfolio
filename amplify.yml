version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - node -v
        - npm -v
        - npm ci
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=4096"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
